<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>KasBoard CK05</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f7fc;--sf:#fff;--tx:#0e1b33;--mu:#5d6b85;--ln:#e1e8f3;--nv:#0b2a63;--bl:#2f7de1;--gr:#12a150;--rd:#d7263d;--ye:#e2a008;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1325;--sf:#111e38;--tx:#e8eefb;--mu:#93a1bf;--ln:#22314f;--nv:#9cc2ff;--bl:#5b9bf0}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;padding-bottom:84px}
.wrap{max-width:720px;margin:auto;padding:16px}
header{display:flex;align-items:center;gap:10px;padding:8px 0 14px}
header img{width:44px;height:44px}header b{font-weight:800;font-size:18px;color:var(--nv)}header small{display:block;color:var(--mu);font-size:12px}
.seg{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font:600 14px inherit;font-family:inherit;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--nv);color:#fff}
:root:not([data-theme=light]) .seg button.on{color:#0a1325}
.hero{background:linear-gradient(135deg,#0b2a63,#2f7de1);color:#fff;border-radius:22px;padding:22px}
.hero small{opacity:.8}.hero h1{margin:2px 0 14px;font-size:34px;font-weight:800;letter-spacing:-.5px}
.hero .r{display:flex;gap:10px}.hero .r div{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.hero .r b{display:block;font-size:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-top:14px}
h2{font-size:16px;margin:0 0 10px;font-weight:800}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.row:first-of-type{border-top:0}
.row .g{flex:1;min-width:0}.row .g b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mu)}
.in{color:var(--gr);font-weight:800}.out{color:var(--rd);font-weight:800}
.bar{height:6px;background:var(--ln);border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.t0{background:#fde7ea;color:var(--rd)}.t1{background:#fdf2d3;color:#8a6200}.t2{background:#d9f5e5;color:#0a7a3b}
.btn{border:0;border-radius:12px;padding:11px 16px;font:700 14px inherit;font-family:inherit;cursor:pointer;background:var(--bl);color:#fff}
.btn.g2{background:var(--gr)}.btn.r2{background:var(--rd)}.btn.o{background:var(--sf);color:var(--nv);border:1px solid var(--ln)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.acts .btn{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 2px;font:600 12px inherit;font-family:inherit;color:var(--mu);cursor:pointer;border-radius:10px}
nav button.on{color:var(--bl);background:rgba(47,125,225,.1)}
dialog{border:0;border-radius:20px;padding:20px;width:min(420px,92vw);background:var(--sf);color:var(--tx)}
dialog::backdrop{background:rgba(5,12,30,.55)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.login{min-height:80vh;display:grid;place-content:center;text-align:center;gap:10px;padding:24px}.login img{width:120px;margin:auto}
.empty{color:var(--mu);text-align:center;padding:18px}
.x{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer}
@media(min-width:900px){body{padding-bottom:20px}nav{position:static;max-width:720px;margin:auto;border:1px solid var(--ln);border-radius:14px}}
</style></head><body>

async function save(){try{localStorage.setItem('kb_data',JSON.stringify(D))}catch(e){alert('Gagal menyimpan di perangkat ini.')}}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ck05:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function gate(){const mk=H===null;$('#app').innerHTML=`<div class="login"><img src="${LOGO}"><h2>KasBoard MOODBOARD CK05</h2>${mk&&!admin?'<p class="empty">Bendahara belum membuat kode akses.</p>':`<p class="empty">${mk?'Buat kode akses (minimal 4 karakter) untuk melindungi data kas.':'Masukkan kode akses kelas.'}</p><input id="kc" type="password" placeholder="Kode akses" style="max-width:260px;margin:auto" onkeydown="event.key=='Enter'&&unlock()"><button class="btn" style="max-width:260px;margin:auto" onclick="unlock()">${mk?'Simpan & buka':'Buka'}</button>`}</div>`}
async function unlock(){const v=$('#kc').value;if(v.length<4){alert('Kode minimal 4 karakter.');return}const h=await sha(v);if(H===null){try{localStorage.setItem('kb_h',h);H=h}catch(e){alert('Gagal menyimpan kode.');return}}else if(h!==H){alert('Kode salah.');return}ok=true;try{sessionStorage.setItem('kb',h)}catch(e){}render()}
async function newCode(){const v=prompt('Kode akses baru (min. 4 karakter):');if(!v||v.length<4)return;const h=await sha(v);try{localStorage.setItem('kb_h',h);H=h;try{sessionStorage.setItem('kb',h)}catch(e){}alert('Kode akses diganti. Bagikan kode baru ke anggota.')}catch(e){alert('Gagal mengganti kode.')}}
function pos(){const c=cur();if(!c.target)return '';const got=MEM.reduce((a,m)=>a+Math.min(paid(m[0]),c.target),0),full=c.target*MEM.length,lunas=MEM.filter(m=>stat(m[0])==2).length;return `<div class="card"><h2>Posisi iuran</h2><div class="row"><div class="g">Tertagih</div><b>${rp(full)}</b></div><div class="row"><div class="g">Terkumpul</div><b class="in">${rp(got)}</b></div><div class="row"><div class="g">Tunggakan</div><b class="out">${rp(full-got)}</b></div><div class="row"><div class="g">Anggota lunas</div><b>${lunas}/${MEM.length}</b></div></div>`}
function charts2(){const c=cur();let h='';const s=c.tx.slice().sort((a,b)=>a.d.localeCompare(b.d));
if(s.length>1){let v=0;const p=s.map(x=>v+=x.t=='in'?x.a:-x.a),mn=Math.min(0,...p),mx=Math.max(...p,1),r=mx-mn||1,pts=p.map((y,i)=>`${i/(p.length-1)*290+5},${110-(y-mn)/r*100}`).join(' ');h+=`<div class="card"><h2>Tren saldo</h2><svg viewBox="0 0 300 120" width="100%" role="img" aria-label="Tren saldo"><polyline points="${pts}" fill="none" stroke="var(--bl)" stroke-width="2.5" stroke-linejoin="round"/></svg><small>${fd(s[0].d)} sampai ${fd(s[s.length-1].d)}</small></div>`}
const ki={};c.tx.filter(x=>x.t=='in').forEach(x=>{const k=x.k||'Tanpa kategori';ki[k]=(ki[k]||0)+x.a});const ie=Object.entries(ki).sort((a,b)=>b[1]-a[1]);
if(ie.length)h+=`<div class="card"><h2>Pemasukan per kategori</h2>${ie.map(([k,v])=>`<div class="row"><div class="g"><b>${esc(k)}</b><div class="bar"><i style="width:${v/ie[0][1]*100}%"></i></div></div><b>${rp(v)}</b></div>`).join('')}</div>`;
const n=[0,1,2].map(i=>MEM.filter(m=>stat(m[0])==i).length),cl=['var(--rd)','var(--ye)','var(--gr)'];
h+=`<div class="card"><h2>Status iuran anggota</h2><div style="display:flex;height:16px;border-radius:9px;overflow:hidden">${n.map((x,i)=>`<i style="width:${x/MEM.length*100}%;background:${cl[i]}"></i>`).join('')}</div><small>${n.map((x,i)=>TG[i]+' '+x).join(' · ')}</small></div>`;return h}
function charts(){const c=cur(),mo={};c.tx.forEach(x=>{const k=x.d.slice(0,7);(mo[k]=mo[k]||{i:0,o:0})[x.t=='in'?'i':'o']+=x.a});const ks=Object.keys(mo).sort().slice(-6);if(!ks.length)return '<div class="card"><div class="empty">Grafik muncul setelah ada transaksi.</div></div>';
const mx=Math.max(...ks.map(k=>Math.max(mo[k].i,mo[k].o)),1),bw=100/ks.length;
const bars=ks.map((k,i)=>{const x0=i*bw+bw*.15,w=bw*.3,hi=mo[k].i/mx*120,ho=mo[k].o/mx*120;return `<rect x="${x0}%" y="${140-hi}" width="${w}%" height="${hi}" rx="3" fill="var(--gr)"/><rect x="${x0+w}%" y="${140-ho}" width="${w}%" height="${ho}" rx="3" fill="var(--rd)"/><text x="${x0+w}%" y="158" text-anchor="middle" font-size="10" fill="var(--mu)">${k.slice(5)}/${k.slice(2,4)}</text>`}).join('');
const ko={};c.tx.filter(x=>x.t=='out').forEach(x=>{const k=x.k||'Tanpa kategori';ko[k]=(ko[k]||0)+x.a});const ke=Object.entries(ko).sort((a,b)=>b[1]-a[1]),km=ke.length?ke[0][1]:1;
return `<div class="card"><h2>Pemasukan vs pengeluaran per bulan</h2><svg viewBox="0 0 300 165" width="100%" role="img" aria-label="Grafik batang bulanan">${bars}</svg><small><span class="in">■</span> Pemasukan &nbsp; <span class="out">■</span> Pengeluaran · maks ${rp(mx)}</small></div><div class="card"><h2>Pengeluaran per kategori</h2>${ke.length?ke.map(([k,v])=>`<div class="row"><div class="g"><b>${esc(k)}</b><div class="bar"><i style="width:${v/km*100}%;background:var(--rd)"></i></div></div><b>${rp(v)}</b></div>`).join(''):'<div class="empty">Belum ada pengeluaran.</div>'}</div>`}
function render(){
 if(!ok){gate();return}
 const t=tot(),c=cur();let h=`<header><img src="${LOGO}"><div><b>KasBoard</b><small>MOODBOARD CK05 · Ilmu Komunikasi · ${admin?'Bendahara':'Pembaca'}</small></div></header>
 <div class="seg">${Object.entries(MODS).map(([k,v])=>`<button class="${k==mod?'on':''}" onclick="mod='${k}';render()">${v}</button>`).join('')}</div>`;
 if(tab=='home'){h+=`<div class="hero"><small>Saldo ${MODS[mod]}</small><h1>${rp(t.s)}</h1><div class="r"><div><small>Pemasukan</small><b>${rp(t.i)}</b></div><div><small>Pengeluaran</small><b>${rp(t.o)}</b></div></div></div>
 ${admin?`<div class="acts"><button class="btn g2" onclick="form('in')">+ Pemasukan</button><button class="btn r2" onclick="form('out')">− Pengeluaran</button></div>`:''}
 ${charts()}${charts2()}<div class="card"><h2>Terbaru</h2>${txList(c.tx.slice(-5).reverse(),false)}</div>
 ${pos()}<div class="card"><h2>Ringkasan iuran</h2>${[2,1,0].map(s=>`<div class="row"><span class="tag t${s}">${TG[s]}</span><div class="g"></div><b>${MEM.filter(m=>stat(m[0])==s).length} anggota</b></div>`).join('')}</div>`}
 if(tab=='mem'){h+=`<div class="card"><h2>Iuran anggota · ${MODS[mod]}</h2>${c.target?`<small>Target ${rp(c.target)} per anggota</small>`:'<small>Target belum diatur</small>'}${admin?` <button class="btn o" style="padding:6px 10px" onclick="setTarget()">Atur target</button>`:''}
 ${MEM.map(m=>{const p=paid(m[0]),s=stat(m[0]);return `<div class="row"><div class="g"><b>${m[0]}. ${esc(m[1])}</b><small>${rp(p)}</small>${c.target?`<div class="bar"><i style="width:${Math.min(100,p/c.target*100)}%"></i></div>`:''}</div><span class="tag t${s}">${TG[s]}</span>${admin?`<button class="btn o" style="padding:6px 10px" onclick="form('in',${m[0]})">+</button>`:''}</div>`}).join('')}</div>
 <div class="acts"><button class="btn o" onclick="remind()">Salin pengingat WhatsApp</button></div>`}
 if(tab=='tx'){h+=`<div class="card"><h2>Semua transaksi · ${MODS[mod]}</h2>${txList(c.tx.slice().reverse(),admin)}</div>`}
 if(tab=='exp'){h+=`<div class="card"><h2>Bagikan laporan ${MODS[mod]}</h2><p style="color:var(--mu);margin:0 0 4px">Laporan hanya memuat modul yang sedang dipilih, jadi saldo tidak tercampur.</p>
 <div class="acts"><button class="btn" onclick="xl()">Excel (.xlsx)</button><button class="btn" onclick="png()">Gambar (.png)</button><button class="btn o" onclick="print()">Cetak / PDF</button><button class="btn o" onclick="bak()">Cadangkan data</button><button class="btn o" onclick="rst()">Pulihkan data</button>${admin?'<button class="btn o" onclick="newCode()">Ganti kode akses</button>':''}</div></div>`}
 h+=`<nav>${[['home','Beranda'],['mem','Anggota'],['tx','Transaksi'],['exp','Bagikan']].map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}</nav>`;
 $('#app').innerHTML=h}
function txList(a,del){return a.length?a.map(x=>`<div class="row"><div class="g"><b>${esc(x.n||(x.t=='in'?'Pemasukan':'Pengeluaran'))}</b><small>${fd(x.d)} · ${esc(nm(x.m))}${x.k?' · '+esc(x.k):''}</small></div><span class="${x.t}">${x.t=='in'?'+':'−'}${rp(x.a)}</span>${del?`<button class="x" onclick="delTx('${x.id}')">×</button>`:''}</div>`).join(''):'<div class="empty">Belum ada transaksi. Mulai dengan menekan tombol tambah.</div>'}
function form(t,m){const d=$('#dlg');d.innerHTML=`<h2>${t=='in'?'Catat pemasukan':'Catat pengeluaran'} · ${MODS[mod]}</h2>
<label>${t=='in'?'Dari anggota':'Untuk'}</label><select id="fm"><option value="0">Umum / lainnya</option>${MEM.map(x=>`<option value="${x[0]}" ${x[0]==m?'selected':''}>${esc(x[1])}</option>`).join('')}</select>
<label>Kategori</label><select id="fk">${KT[t].map(k=>`<option>${esc(k)}</option>`).join('')}</select>
<label>Jumlah (Rp)</label><input id="fa" type="number" inputmode="numeric" min="0"><label>Tanggal</label><input id="fd" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Catatan</label><input id="fn" placeholder="${t=='in'?'Iuran Oktober':'Beli konsumsi'}">
<div class="acts"><button class="btn o" onclick="$('#dlg').close()">Batal</button><button class="btn ${t=='in'?'g2':'r2'}" onclick="add('${t}')">Simpan</button></div>`;d.showModal()}
async function add(t){const a=+$('#fa').value;if(!a||a<=0){$('#fa').focus();return}cur().tx.push({id:Date.now().toString(36),t,k:$('#fk').value,d:$('#fd').value,m:+$('#fm').value,a,n:$('#fn').value.trim()});$('#dlg').close();render();await save()}
async function delTx(id){if(!confirm('Hapus transaksi ini?'))return;cur().tx=cur().tx.filter(x=>x.id!=id);render();await save()}
async function setTarget(){const v=prompt('Target iuran per anggota (Rp):',cur().target||'');if(v===null)return;cur().target=Math.max(0,+v||0);render();await save()}
function remind(){const c=cur(),b=MEM.filter(m=>stat(m[0])<2);const s=`Halo MOODBOARD CK05! Pengingat ${MODS[mod]}.\n${c.target?'Target: '+rp(c.target)+' per anggota.\n':''}Yang belum lunas:\n`+b.map(m=>'- '+m[1]).join('\n')+'\nTerima kasih, mohon segera dilunasi ya.';navigator.clipboard.writeText(s).then(()=>alert('Pengingat disalin. Tempel di grup WhatsApp.'),()=>prompt('Salin teks ini:',s))}
function dl(name,data){const b=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function xl(){const t=tot(),c=cur(),w=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['MOODBOARD CK05 — '+MODS[mod]],[],['Pemasukan',t.i],['Pengeluaran',t.o],['Saldo',t.s]]),'Ringkasan');
 let sd=0;const bk=c.tx.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(x=>{sd+=x.t=='in'?x.a:-x.a;return[fd(x.d),x.k||'',nm(x.m),x.n,x.t=='in'?x.a:'',x.t=='out'?x.a:'',sd]});
 XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Tanggal','Kategori','Nama','Catatan','Debet (Masuk)','Kredit (Keluar)','Saldo'],...bk]),'Buku Kas');
 const ct={};c.tx.forEach(x=>{const k=(x.t=='in'?'Masuk: ':'Keluar: ')+(x.k||'Tanpa kategori');ct[k]=(ct[k]||0)+x.a});
 XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Kategori','Total (Rp)'],...Object.entries(ct)]),'Per Kategori');
 XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['No','Nama','Total bayar (Rp)','Status'],...MEM.map(m=>[m[0],m[1],paid(m[0]),TG[stat(m[0])]])]),'Anggota');
 dl(`KasBoard-${mod}-${new Date().toISOString().slice(0,10)}.xlsx`,XLSX.write(w,{type:'array',bookType:'xlsx'}))}
function png(){const t=tot(),c=cur(),W=1080,H=520+Math.ceil(MEM.length/2)*52+80,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
 x.fillStyle='#f4f7fc';x.fillRect(0,0,W,H);const g=x.createLinearGradient(0,0,W,300);g.addColorStop(0,'#0b2a63');g.addColorStop(1,'#2f7de1');x.fillStyle=g;x.fillRect(0,0,W,300);
 const im=new Image();im.onload=()=>{x.fillStyle='#fff';x.beginPath();x.arc(120,120,70,0,7);x.fill();x.drawImage(im,60,60,120,120);
 const F='Plus Jakarta Sans,sans-serif';x.fillStyle='#fff';x.font='800 44px '+F;x.fillText('Laporan '+MODS[mod],220,110);x.font='600 26px '+F;x.fillText('MOODBOARD CK05 · '+new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}),220,155);
 x.font='800 64px '+F;x.fillText(rp(t.s),60,260);x.font='600 24px '+F;x.fillText('Saldo',60,200);
 x.fillStyle='#d9f5e5';x.fillText('Masuk '+rp(t.i),520,200);x.fillStyle='#ffd3d9';x.fillText('Keluar '+rp(t.o),520,250);
 x.fillStyle='#0b2a63';x.font='800 30px '+F;x.fillText('Status iuran anggota',60,360);
 MEM.forEach((m,i)=>{const cx=60+(i%2)*500,cy=410+Math.floor(i/2)*52,s=stat(m[0]);x.fillStyle=['#d7263d','#e2a008','#12a150'][s];x.beginPath();x.arc(cx+8,cy-8,8,0,7);x.fill();x.fillStyle='#0e1b33';x.font='600 22px '+F;x.fillText(m[1].slice(0,26),cx+28,cy);x.font='400 20px '+F;x.fillStyle='#5d6b85';x.fillText(rp(paid(m[0])),cx+360,cy)});
 x.fillStyle='#5d6b85';x.font='400 20px '+F;x.fillText('Hijau lunas · Kuning kurang · Merah belum bayar',60,H-30);
 cv.toBlob(b=>dl(`KasBoard-${mod}.png`,b),'image/png')};im.src=LOGO}
function bak(){dl('kasboard-cadangan.json',JSON.stringify(D))}
function rst(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d.kelas||!d.seminar)throw 0;D=d;await save();render();alert('Data dipulihkan.')}catch(e){alert('File cadangan tidak valid.')}};i.click()}
boot();
</script></body></html>
