<style>
:root{--bg:#f2f6fc;--card:#fff;--tx:#0f1f3d;--mu:#5b6b85;--navy:#0b2a5b;--blue:#1e6fe0;--g:#14894a;--r:#d33a3a;--bd:#dde5f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1426;--card:#122140;--tx:#e8eefb;--mu:#93a4c4;--bd:#223559;--g:#3ccf7e;--r:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:760px;margin:auto;padding:14px 14px 100px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .c{margin:0}
.big{font-size:22px;font-weight:700}.mu{color:var(--mu);font-size:13px}.in{color:var(--g)}.out{color:var(--r)}
h2{margin:6px 0}h3{margin:4px 0 10px}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.b2{background:transparent;color:var(--blue);border:1px solid var(--bd)}.bd{background:var(--r)}.sm{padding:6px 10px;font-size:13px}
input,select{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin:4px 0 8px}
label{font-size:13px;color:var(--mu);display:block}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.hd{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:16px;padding:12px}
.hd img{width:60px;height:60px;background:#fff;border-radius:50%;padding:3px}
.bar{height:10px;border-radius:6px;background:var(--bd);margin:3px 0}.bar i{display:block;height:100%;border-radius:6px}
.tx{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--bd);font-size:12px;margin:2px}
.warn{background:#fff4d6;color:#7a5200;border-radius:12px;padding:10px;margin:10px 0}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb td,.tb th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}.tb .n{text-align:right}
.fab{position:fixed;right:16px;bottom:84px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:4}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mu);padding:6px 2px;font-size:11px;border-radius:10px}nav button.on{color:var(--blue);background:rgba(30,111,224,.12)}
nav i{display:block;font-style:normal;font-size:20px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}#md.s{display:flex}
#md>div{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
@media(min-width:900px){nav{top:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding-top:20px;justify-content:flex-start}nav button{flex:none;font-size:14px;text-align:left;padding:12px}nav i{display:inline;margin-right:8px}#app{margin-left:230px;max-width:820px}.fab{bottom:24px}#md{align-items:center}#md>div{border-radius:20px}}
@media print{nav,.np,.fab{display:none!important}#app{margin:0;max-width:none;padding:0}body{background:#fff;color:#000}}

function row(f,t,bl,act){return `<div class=tx><div><b>${esc(t.cat)}</b> <span class=mu>${fd(t.date)}</span><div class=mu>${esc(t.desc||'(tanpa keterangan)')} · ${esc(t.who||'-')}</div>${bl!=null?`<div class=mu>Saldo: ${rp(bl)}</div>`:''}${act?`<div style="margin-top:6px"><button class="b2 sm" onclick="form('${f}','${t.id}')">Ubah</button> <button class="b2 sm out" onclick="del('${f}','${t.id}')">Hapus</button></div>`:''}</div><b class="${t.type}" style="white-space:nowrap">${t.type=='in'?'+':'-'}${rp(t.amt)}</b></div>`}
function recent(f){const l=srt(f).slice(-4).reverse();return l.length?l.map(t=>row(f,t)).join(''):'<p class=mu>Belum ada transaksi.</p>'}
function vHome(){const card=f=>{const s=sums(f);return `<div class=c><div class=mu>${FN[f]}</div><div class=big>${rp(saldo(f))}</div><div class=mu><span class=in>▲ ${rp(s.i)}</span><br><span class=out>▼ ${rp(s.o)}</span></div></div>`};
const inc=[...S.kas,...S.sem].filter(t=>!t.desc||!t.who).length,mx=Math.max(1,...['kas','sem'].map(f=>{const s=sums(f);return Math.max(s.i,s.o)}));
const bar=f=>{const s=sums(f);return `<div class=mu>${FN[f]} (hijau: masuk, merah: keluar)</div><div class=bar><i style="width:${s.i/mx*100}%;background:var(--g)"></i></div><div class=bar><i style="width:${s.o/mx*100}%;background:var(--r)"></i></div>`};
return `<div class=hd><img src="${LOGO}" alt="MOODBOARD CK05"><div><b>MOODBOARD CK05</b><div style="font-size:13px">Kelas 01IKOK005 · Ilmu Komunikasi</div></div></div>
${inc?`<div class=warn>⚠️ ${inc} transaksi belum lengkap (keterangan atau nama kosong).</div>`:''}
<div class=g2 style="margin-top:10px">${card('kas')}${card('sem')}</div><div class="mu" style="margin:6px 2px">Saldo kedua dana dipisah dan tidak boleh dipakai bersama. Total gabungan hanya informasi: ${rp(saldo('kas')+saldo('sem'))}</div>
<div class=c><b>Grafik ringkasan</b>${bar('kas')}${bar('sem')}</div>
<div class=row><button onclick="form('kas')">+ Kas Kelas</button><button onclick="form('sem')">+ Dana Seminar</button><button class=b2 onclick="go('lap')">Laporan</button></div>
<div class=c><b>Transaksi terbaru · Kas Kelas</b>${recent('kas')}</div><div class=c><b>Transaksi terbaru · Dana Seminar</b>${recent('sem')}</div>`}
function lst(f){const q=FS[f],map={};let b=S.open[f];srt(f).forEach(t=>{b+=t.type=='in'?t.amt:-t.amt;map[t.id]=b});
const l=srt(f).reverse().filter(t=>(!q.q||(t.desc+t.who+t.cat+t.note).toLowerCase().includes(q.q.toLowerCase()))&&(!q.type||t.type==q.type)&&(!q.cat||t.cat==q.cat)&&(!q.from||t.date>=q.from)&&(!q.to||t.date<=q.to));
return l.length?`<div class=c>${l.map(t=>row(f,t,map[t.id],1)).join('')}</div>`:'<div class=c><p class=mu>Tidak ada transaksi yang cocok.</p></div>'}
function upd(f){$('#lst').innerHTML=lst(f)}
function vTx(f){const s=sums(f),q=FS[f],cs=[...S.cats[f].in,...S.cats[f].out];
let info='';if(f=='sem'){const p=pct(),e=S.sem;info=`<div class=c><b>${esc(e.name)}</b><div class=mu>${fd(e.date)} · ${esc(e.loc)}</div><div class=mu>Target ${rp(e.target)} · Terkumpul ${rp(s.i)} · Pengeluaran ${rp(s.o)}</div><div class=bar><i style="width:${p}%;background:var(--blue)"></i></div><b>${p}% tercapai</b></div>`}
return `<h2>${FN[f]}</h2><div class=c><div class=mu>Saldo ${FN[f]}</div><div class=big>${rp(saldo(f))}</div><span class=in>▲ ${rp(s.i)}</span> · <span class=out>▼ ${rp(s.o)}</span></div>${info}
<div class=c><input placeholder="Cari kata kunci..." value="${esc(q.q||'')}" oninput="FS.${f}.q=this.value;upd('${f}')"><div class=row><select onchange="FS.${f}.type=this.value;upd('${f}')"><option value="">Semua jenis</option><option value=in ${q.type=='in'?'selected':''}>Pemasukan</option><option value=out ${q.type=='out'?'selected':''}>Pengeluaran</option></select><select onchange="FS.${f}.cat=this.value;upd('${f}')"><option value="">Semua kategori</option>${cs.map(c=>`<option ${q.cat==c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class=row><input type=date value="${q.from||''}" onchange="FS.${f}.from=this.value;upd('${f}')"><input type=date value="${q.to||''}" onchange="FS.${f}.to=this.value;upd('${f}')"></div></div>
<div id=lst>${lst(f)}</div><button class=fab onclick="form('${f}')">+ Transaksi</button>`}
function memTot(f,m){return S[f].filter(t=>t.mid==m.id&&t.type=='in'&&(f=='sem'||t.cat=='Iuran kelas')).reduce((a,t)=>a+t.amt,0)}
function vAng(){return `<h2>Anggota Kelas</h2><div class=c><div class=mu>Target iuran per anggota: ${rp(S.iuran)} (ubah di Menu)</div></div>`+S.members.map(m=>{const k=memTot('kas',m),s=memTot('sem',m),st=S.iuran>0?(k>=S.iuran?'<span class=in>Lunas</span>':'<span class=out>Belum lunas</span>'):'-';
return `<div class=c style="${m.active?'':'opacity:.55'}"><b>${esc(m.name)}</b> ${m.active?'':'(nonaktif)'} ${m.demo?'<span class=chip>DEMO</span>':''}<div class=mu>NIM: ${esc(m.nim||'-')}</div><div class=mu>Iuran: ${rp(k)} · ${st}</div><div class=mu>Kontribusi seminar: ${rp(s)}</div><div style="margin-top:6px"><button class="b2 sm" onclick="mform('${m.id}')">Ubah</button> <button class="b2 sm" onclick="tog('${m.id}')">${m.active?'Nonaktifkan':'Aktifkan'}</button></div></div>`}).join('')+`<button class=fab onclick="mform()">+ Anggota</button>`}
function mform(id){const m=id?S.members.find(x=>x.id==id):{name:'',nim:''};FM={id};md(`<h3>${id?'Ubah':'Tambah'} Anggota</h3><label>Nama<input id=mn value="${esc(m.name)}"></label><label>NIM (opsional)<input id=mi value="${esc(m.nim)}"></label><div class=row><button class=b2 onclick="cl()">Batal</button><button onclick="msv()">Simpan</button></div>`)}
function msv(){const n=$('#mn').value.trim();if(!n){alert('Nama wajib diisi.');return}if(FM.id){const m=S.members.find(x=>x.id==FM.id);m.name=n;m.nim=$('#mi').value}else S.members.push({id:'M'+Date.now(),name:n,nim:$('#mi').value,active:true});save();cl();render()}
function tog(id){const m=S.members.find(x=>x.id==id);m.active=!m.active;save();render()}
function prev(f){const r=rep(f),tb=(h,rows)=>`<table class=tb><tr>${h.map((x,i)=>`<th class="${i&&x!='Ket'?'n':''}">${x}</th>`).join('')}</tr>${rows}</table>`;
return `<div class=c><b>${f=='kas'?'Laporan Kas Kelas 01IKOK005':'Laporan Dana Seminar: '+esc(S.sem.name)}</b>${r.demo?' <span class=chip>memuat data DEMO</span>':''}<div class=mu>Periode: ${r.per}</div>
<table class=tb><tr><td>Saldo awal</td><td class=n>${rp(r.open)}</td></tr><tr><td>Total pemasukan</td><td class="n in">${rp(r.i)}</td></tr><tr><td>Total pengeluaran</td><td class="n out">${rp(r.o)}</td></tr><tr><td><b>Saldo akhir</b></td><td class=n><b>${rp(r.close)}</b></td></tr>${f=='sem'?`<tr><td>Target / tercapai</td><td class=n>${rp(S.sem.target)} / ${pct()}%</td></tr>`:''}</table></div>
<div class=c><b>Rekap per kategori</b>${r.cats.length?tb(['Kategori','Nominal'],r.cats.map(c=>`<tr><td>${esc(c[0])}</td><td class=n>${rp(c[1])}</td></tr>`).join('')):'<p class=mu>Data kosong.</p>'}</div>
<div class=c><b>${f=='kas'?'Rekap pemasukan per nama':'Daftar kontributor'}</b>${r.who.length?tb(['Nama','Nominal'],r.who.map(c=>`<tr><td>${esc(c[0])}</td><td class=n>${rp(c[1])}</td></tr>`).join('')):'<p class=mu>Data kosong.</p>'}</div>
<div class=c><b>Daftar transaksi</b>${r.list.length?tb(['Tgl','Ket','Nominal'],r.list.map(t=>`<tr><td>${fd(t.date)}</td><td>${esc(t.cat)}<div class=mu>${esc(t.desc)}</div></td><td class="n ${t.type}">${t.type=='in'?'+':'-'}${rp(t.amt)}</td></tr>`).join('')):'<p class=mu>Tidak ada transaksi pada periode ini.</p>'}</div>`}
function vLap(){return `<h2 class=np>Laporan</h2><div class="row np"><button class="${RF=='kas'?'':'b2'}" onclick="RF='kas';render()">Kas Kelas</button><button class="${RF=='sem'?'':'b2'}" onclick="RF='sem';render()">Dana Seminar</button></div>
<div class="c np"><div class=row><label>Dari<input type=date value="${R.from}" onchange="R.from=this.value;render()"></label><label>Sampai<input type=date value="${R.to}" onchange="R.to=this.value;render()"></label></div><div class=row><button onclick="xl('${RF}')">Excel (.xlsx)</button><button onclick="png('${RF}')">Gambar (.png)</button><button class=b2 onclick="window.print()">Cetak / PDF</button></div></div>${prev(RF)}`}
function vMenu(){const cm=f=>['in','out'].map(ty=>`<div class=mu>${FN[f]} · ${ty=='in'?'Pemasukan':'Pengeluaran'}</div>${S.cats[f][ty].map(c=>`<span class=chip onclick="rmc('${f}','${ty}','${esc(c)}')">${esc(c)} ✕</span>`).join('')}<span class=chip onclick="addc('${f}','${ty}')">＋ tambah</span>`).join('');
const e=S.sem;return `<h2>Menu · Pengaturan</h2><div class=c><b>Saldo awal</b><label>Kas Kelas (Rp)<input type=number min=0 value="${S.open.kas}" onchange="S.open.kas=Math.max(0,Math.round(+this.value));save()"></label><label>Dana Seminar (Rp)<input type=number min=0 value="${S.open.sem}" onchange="S.open.sem=Math.max(0,Math.round(+this.value));save()"></label><label>Target iuran per anggota (Rp)<input type=number min=0 value="${S.iuran}" onchange="S.iuran=Math.max(0,Math.round(+this.value));save()"></label></div>
<div class=c><b>Data seminar</b><label>Nama kegiatan<input value="${esc(e.name)}" onchange="S.sem.name=this.value;save()"></label><label>Tanggal<input type=date value="${e.date}" onchange="S.sem.date=this.value;save()"></label><label>Lokasi<input value="${esc(e.loc)}" onchange="S.sem.loc=this.value;save()"></label><label>Target dana (Rp)<input type=number min=0 value="${e.target}" onchange="S.sem.target=Math.max(0,Math.round(+this.value));save()"></label></div>
<div class=c><b>Kategori</b>${cm('kas')}${cm('sem')}</div>
<div class=c><b>Data</b><p class=mu>Data tersimpan di browser perangkat ini saja (tidak tersinkron antarperangkat).</p><div class=row><button class=b2 onclick="deldemo()">Hapus data DEMO</button><button class="bd" onclick="rst()">Reset semua</button></div></div>`}
function addc(f,t){const n=prompt('Nama kategori baru:');if(n&&n.trim()){S.cats[f][t].push(n.trim());save();render()}}
function rmc(f,t,c){if(confirm('Hapus kategori "'+c+'"? Transaksi lama tetap tersimpan.')){S.cats[f][t]=S.cats[f][t].filter(x=>x!=c);save();render()}}
function deldemo(){if(confirm('Hapus semua data DEMO?')){['kas','sem'].forEach(f=>S[f]=S[f].filter(t=>!t.demo));S.members=S.members.filter(m=>!m.demo);save();render()}}
function rst(){if(confirm('Reset SELURUH data? Tindakan ini tidak bisa dibatalkan.')){S=seed();save();render()}}
function md(h){$('#md').innerHTML='<div>'+h+'</div>';$('#md').classList.add('s')}
function cl(){$('#md').classList.remove('s')}
$('#md').onclick=e=>{if(e.target.id=='md')cl()};
function form(f,id){const t=id?S[f].find(x=>x.id==id):{date:td(),type:'in',cat:'',desc:'',who:'',amt:'',method:'Tunai',note:'',mid:''};FM={f,id,cat:t.cat};
md(`<h3>${id?'Ubah':'Tambah'} Transaksi · ${FN[f]}</h3><label>Tanggal<input id=xd type=date value="${t.date}"></label><label>Jenis<select id=xt onchange="fc()"><option value=in ${t.type=='in'?'selected':''}>Pemasukan</option><option value=out ${t.type=='out'?'selected':''}>Pengeluaran</option></select></label><label>Kategori<select id=xc></select></label><label>Anggota (opsional)<select id=xm onchange="fm()"><option value="">-</option>${S.members.filter(m=>m.active||m.id==t.mid).map(m=>`<option value="${m.id}" ${m.id==t.mid?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><label>Nama pembayar / penerima<input id=xw value="${esc(t.who)}"></label><label>Keterangan<input id=xk value="${esc(t.desc)}"></label><label>Nominal (Rp)<input id=xa type=number inputmode=numeric min=1 step=1 value="${t.amt}"></label><label>Metode<select id=xp>${['Tunai','Transfer','E-wallet'].map(x=>`<option ${t.method==x?'selected':''}>${x}</option>`).join('')}</select></label><label>Catatan<input id=xn value="${esc(t.note)}"></label>${f=='sem'?`<div class=mu>Kegiatan: ${esc(S.sem.name)}</div>`:''}<div class=row style="margin-top:10px"><button class=b2 onclick="cl()">Batal</button><button onclick="sv()">Simpan</button></div>`);fc()}
function fc(){const f=FM.f,ty=$('#xt').value;$('#xc').innerHTML=S.cats[f][ty].map(c=>`<option ${c==FM.cat?'selected':''}>${esc(c)}</option>`).join('')}
function fm(){const m=S.members.find(x=>x.id==$('#xm').value);if(m)$('#xw').value=m.name}
function sv(){const f=FM.f,d=$('#xd').value,ty=$('#xt').value,a=Math.round(Number($('#xa').value));if(!d||!ty||!(a>0)||!$('#xc').value){alert('Tanggal, jenis, kategori, dan nominal (lebih dari 0) wajib diisi dengan benar.');return}
const o={date:d,type:ty,cat:$('#xc').value,desc:$('#xk').value.trim(),who:$('#xw').value.trim(),mid:$('#xm').value,amt:a,method:$('#xp').value,note:$('#xn').value.trim()};
if(FM.id)Object.assign(S[f].find(x=>x.id==FM.id),o);else S[f].push({id:(f=='kas'?'KAS-':'SEM-')+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(),ts:Date.now(),...o});
save();cl();render()}
function del(f,id){if(confirm('Hapus transaksi ini? Saldo akan dihitung ulang.')){S[f]=S[f].filter(x=>x.id!=id);save();render()}}
function xl(f){const r=rep(f),W=XLSX.utils.book_new(),add=(n,a,w)=>{const s=XLSX.utils.aoa_to_sheet(a);Object.keys(s).forEach(k=>{if(k[0]!='!'&&s[k].t=='n')s[k].z='"Rp" #,##0'});s['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(W,s,n)};
const h=[['Kas Kelas 01IKOK005 — MOODBOARD CK05'],[f=='kas'?'Laporan Kas Kelas':'Laporan Dana Seminar: '+S.sem.name],['Periode',r.per],[],['Saldo awal',r.open],['Total pemasukan',r.i],['Total pengeluaran',r.o],['Saldo akhir',r.close]];
if(f=='sem')h.push(['Target dana',S.sem.target],['Tercapai',pct()+'%']);if(r.demo)h.push([],['Catatan','Memuat data DEMO']);
add('Ringkasan',h,[28,26]);
add('Transaksi',[['ID','Tanggal','Jenis','Kategori','Keterangan','Nama','Nominal','Metode','Catatan','Saldo berjalan'],...r.list.map(t=>[t.id,fd(t.date),t.type=='in'?'Pemasukan':'Pengeluaran',t.cat,t.desc,t.who,t.amt,t.method,t.note,t.b])],[18,12,12,20,30,22,16,12,20,16]);
add('Rekap Kategori',[['Kategori','Nominal'],...r.cats],[34,16]);add(f=='kas'?'Rekap Pemasukan':'Kontributor',[['Nama','Nominal'],...r.who],[30,16]);
XLSX.writeFile(W,f=='kas'?'Laporan_Kas_Kelas_01IKOK005.xlsx':'Laporan_Dana_Seminar_01IKOK005.xlsx')}
function png(f){const r=rep(f),im=new Image();im.onload=()=>{const W=1080,rows=r.list.slice(-10).reverse(),H=640+r.cats.length*50+(rows.length?100+rows.length*70:0)+(f=='sem'?60:0);
const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');let y=0;
const T=(s,px,py,fo,co,al)=>{x.font=fo;x.fillStyle=co;x.textAlign=al||'left';let t=String(s);while(x.measureText(t).width>(al=='right'?500:W-px-60)&&t.length>3)t=t.slice(0,-2);if(t!=String(s))t+='…';x.fillText(t,px,py)};
x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#0b2a5b';x.fillRect(0,0,W,250);x.fillStyle='#fff';x.beginPath();x.arc(150,125,95,0,7);x.fill();x.drawImage(im,65,40,170,170);
T('Kas Kelas 01IKOK005',270,110,'bold 46px sans-serif','#fff');T('MOODBOARD CK05 · Ilmu Komunikasi',270,160,'28px sans-serif','#bcd3f7');
T(f=='kas'?'Laporan Kas Kelas':'Laporan Dana Seminar',50,320,'bold 42px sans-serif','#0b2a5b');T(f=='sem'?S.sem.name:'Kas rutin kelas',50,365,'28px sans-serif','#334');T('Periode: '+r.per+(r.demo?' · memuat data DEMO':''),50,405,'26px sans-serif','#667');
y=470;[['Saldo awal',r.open,'#0b2a5b'],['Pemasukan',r.i,'#14894a'],['Pengeluaran',r.o,'#d33a3a'],['SALDO AKHIR',r.close,'#0b2a5b']].forEach((a,i)=>{x.fillStyle=i==3?'#e7f0ff':'#f4f7fb';x.fillRect(40,y-38,W-80,60);T(a[0],60,y,(i==3?'bold ':'')+'30px sans-serif','#223');T(rp(a[1]),W-60,y,'bold 32px sans-serif',a[2],'right');y+=70});
if(f=='sem'){T('Target '+rp(S.sem.target)+' · tercapai '+pct()+'%',60,y,'28px sans-serif','#223');y+=60}
y+=20;T('Rekap per kategori',50,y,'bold 32px sans-serif','#0b2a5b');y+=50;r.cats.forEach(k=>{T(k[0],60,y,'26px sans-serif','#223');T(rp(k[1]),W-60,y,'26px sans-serif','#223','right');y+=50});
if(rows.length){y+=30;T('Transaksi terakhir',50,y,'bold 32px sans-serif','#0b2a5b');y+=50;rows.forEach(t=>{T(fd(t.date)+' · '+t.cat,60,y,'24px sans-serif','#223');T((t.type=='in'?'+':'-')+rp(t.amt),W-60,y,'bold 26px sans-serif',t.type=='in'?'#14894a':'#d33a3a','right');T(t.desc||'-',60,y+30,'20px sans-serif','#778');y+=70})}
T('Dibuat '+fd(td())+' · Kas Kelas 01IKOK005',W/2,H-30,'20px sans-serif','#889','center');
const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=(f=='kas'?'Laporan_Kas_Kelas_01IKOK005':'Laporan_Dana_Seminar_01IKOK005')+'.png';a.click()};im.src=LOGO}
const NAV=[['home','🏠','Beranda'],['kas','💰','Kas Kelas'],['sem','🎓','Dana Seminar'],['lap','📊','Laporan'],['menu','☰','Menu']];
function go(v){V=v;render();window.scrollTo(0,0)}
function render(){const m={home:vHome,kas:()=>vTx('kas'),sem:()=>vTx('sem'),ang:vAng,lap:vLap,menu:()=>vMenu()+'<div class=c><button class=b2 style="width:100%" onclick="go(\'ang\')">👥 Anggota Kelas</button></div>'};
$('#app').innerHTML=m[V]();$('#nv').innerHTML=NAV.map(n=>`<button class="${n[0]==V?'on':''}" onclick="go('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join('')}
load();render();
</script></body></html>
