.w{max-width:720px;margin:auto;padding:0 14px}
.top{background:var(--bl);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 18px}
.top.s h3{margin:0 0 12px;font-size:20px;font-weight:800}
.hr{display:flex;align-items:center;gap:10px}.hr img{width:36px;height:36px;background:#fff;border-radius:50%;padding:2px}
.bl{border:0;background:none;color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;text-align:left}
.pill{border:0;border-radius:99px;background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:12px;padding:8px 14px;cursor:pointer}
.qa{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:18px 0 14px}
.qa button{background:none;border:0;color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.qa span{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 6px;border:2px solid rgba(255,255,255,.55);border-radius:16px;background:rgba(255,255,255,.12)}
.ban{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,#0b6fc0,#35b6ff);border-radius:18px;padding:16px}
.ban div{flex:1}.ban b{display:block;font-size:16px}.ban small{color:#e6f3fd}
.cta{border:0;border-radius:99px;background:#ffc107;color:#5a3d00;font-weight:800;font-size:12px;padding:10px 14px;cursor:pointer}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;text-align:center;margin-top:-6px;position:relative}
.grid button{background:none;border:0;color:var(--tx);font-size:12px;font-weight:600;cursor:pointer}
.gi{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 4px;border-radius:50%;background:color-mix(in srgb,currentColor 14%,transparent);color:var(--bl);flex:none}
.feed .fl{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.shield{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--bl);color:#fff;font-weight:700;font-size:15px;padding:14px;border-radius:14px;margin-top:12px;cursor:pointer;justify-content:space-between}
h2{font-size:16px;margin:0 0 10px;font-weight:800}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--ln)}h2+.row,.mh+.row{border-top:0}
.row .g{flex:1;min-width:0}.row .g b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}small{color:var(--mu)}
.av{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--bl);font-weight:800;font-size:13px;flex:none}.av.i{background:#dcf5e7;color:var(--gr)}.av.o{background:#fde6ea;color:var(--rd)}
.ib{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;border:1px solid var(--ln);flex:none}.ib.i{color:var(--gr)}.ib.o{color:var(--rd)}
.mh{font-weight:800;font-size:16px;margin:14px 0 2px}.mh2{display:flex;justify-content:flex-end}
.lk{border:0;background:none;color:var(--bl);font-weight:700;display:flex;align-items:center;gap:4px;margin-top:10px;cursor:pointer}
.srch{display:flex;align-items:center;gap:8px;background:#fff;color:var(--bl);border-radius:12px;padding:0 12px}.srch input{border:0;background:none;color:#14213d;padding:12px 0}
.seg2{display:flex;background:rgba(0,0,0,.18);border-radius:12px;padding:4px;max-width:340px;margin:0 auto 14px}
.seg2 button{flex:1;border:0;background:none;color:#fff;font-weight:700;font-size:13px;padding:9px;border-radius:9px;cursor:pointer}.seg2 button.on{background:rgba(255,255,255,.3)}
.pf{display:flex;gap:14px;align-items:center}.pf img{width:78px;height:78px;background:#fff;border-radius:50%;padding:4px}.pf b{font-size:19px;display:block}.pf small{color:#e6f3fd}
.pls{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.ol{border:2px solid #fff;background:none;color:#fff;border-radius:99px;padding:5px 12px;font-weight:700;font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 6px;text-align:center;font-size:13px}.g3 b{display:block;color:var(--bl);font-weight:600;font-size:13px}
.dot{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 4px}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}.io div{display:flex;align-items:center;gap:10px}.io b{display:block;font-size:16px}.io small{display:block}
.ci{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:#fff;flex:none}.ci.g{background:#16c05a}.ci.o{background:#ff8a00}
.mi{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--ln);background:none;color:var(--tx);padding:15px 2px;font-size:16px;font-weight:600;cursor:pointer;text-align:left}.mi span:not(.gi){flex:1}.card .mi:first-child{border-top:0}
.in{color:var(--gr);font-weight:800}.out{color:var(--rd);font-weight:800}
.bar{height:6px;background:var(--ln);border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.t0{background:#fde7ea;color:var(--rd)}.t1{background:#fdf2d3;color:#8a6200}.t2{background:#d9f5e5;color:#0a7a3b}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--bl);color:#fff}
.btn.g2{background:var(--gr)}.btn.r2{background:var(--rd)}.btn.o{background:var(--sf);color:var(--bl);border:1px solid var(--ln)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.acts .btn{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;padding:6px 2px;font-weight:600;font-size:12px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--tx)}nav button.on svg{color:var(--bl)}
nav .pay{flex:0 0 74px;height:74px;margin:-30px 4px 0;border-radius:50%;background:var(--bl);color:#fff;box-shadow:0 4px 14px rgba(16,142,233,.5);justify-content:center}
dialog{border:0;border-radius:20px;padding:20px;width:min(420px,92vw);background:var(--sf);color:var(--tx)}
dialog::backdrop{background:rgba(5,12,30,.55)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.login{min-height:80vh;display:grid;place-content:center;text-align:center;gap:10px;padding:24px}.login img{width:120px;margin:auto}
.empty{color:var(--mu);text-align:center;padding:18px}
.x{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer}
@media(min-width:900px){body{padding-bottom:20px}nav{position:static;max-width:720px;margin:auto;border:1px solid var(--ln);border-radius:14px}}
.hr img,.pf img{object-fit:cover}.hr img{cursor:pointer}
:root[data-theme=dark]{--bg:#0a1325;--sf:#111e38;--tx:#e8eefb;--mu:#93a1bf;--ln:#22314f;--soft:#1a2c52}

.au{min-height:100vh;display:flex;flex-direction:column;background:var(--bl)}
.ah{color:#fff;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 34px}.ah.big{padding-bottom:48px}
.ab{display:flex;align-items:center;justify-content:space-between;margin:0 auto 18px;max-width:520px}
.br{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px}.br img{width:34px;height:34px;background:#fff;border-radius:50%;padding:2px}.ab b{font-size:13px;opacity:.75}
.bk{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer}
.ai{position:relative;width:110px;height:110px;margin:6px auto 14px}.ai img{position:relative;width:110px;height:110px;border-radius:30px;background:#fff;padding:10px;animation:fl 3s ease-in-out infinite}
.ai i{position:absolute;border-radius:50%;background:rgba(255,255,255,.28)}.c1{width:26px;height:26px;top:-6px;right:-14px;animation:fl 2.4s ease-in-out infinite}.c2{width:16px;height:16px;bottom:8px;left:-18px;animation:fl 3.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.ah h1{margin:0;font-size:28px;font-weight:800}.ah p{margin:6px 0 0;opacity:.92}
.as{flex:1;background:var(--sf);color:var(--tx);border-radius:28px 28px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .35s ease}
.as>*{max-width:520px;margin-left:auto;margin-right:auto}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.as h2{font-size:20px;margin:0 0 14px}
.pf2{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ln);border-radius:16px;padding:0 14px;color:var(--mu);background:var(--bg)}.pf2 input{border:0;background:none;padding:15px 0;font-size:16px;color:var(--tx);outline:0;min-width:0}.pf2 span{white-space:nowrap}
.btn.big{display:block;width:100%;margin-top:14px;padding:15px;border-radius:16px;font-size:16px}
.lk2,.note{text-align:center;color:var(--mu);font-size:14px}.lk2 a{color:var(--bl);font-weight:700;cursor:pointer}
.sec{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mu);border-top:1px solid var(--ln);padding-top:16px;margin-top:18px;font-size:14px}.sec svg{color:var(--bl)}
.dots{display:flex;justify-content:center;gap:12px;margin:6px auto 22px}.dots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-size:11px;font-weight:700;font-style:normal;color:#fff}.dots i.f{background:var(--bl);border-color:var(--bl)}.dots.sh{animation:sk .35s}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px!important}.kp button{border:0;background:var(--bg);color:var(--tx);height:58px;border-radius:18px;font-size:22px;font-weight:700;cursor:pointer;display:grid;place-items:center;transition:transform .1s}.kp button:active{transform:scale(.94);background:var(--soft)}
.lk3{display:block;border:0;background:none;color:var(--bl);font-weight:700;margin:16px auto 0;cursor:pointer}.lk3:disabled{color:var(--mu)}
.sim{background:#fff6dd;color:#7a5600;border-radius:14px;padding:12px;font-size:13px;margin-bottom:18px}.sim .cd{font-size:18px;letter-spacing:3px}
.warn{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:12px;font-size:13px;margin-top:18px}.warn svg{color:var(--bl);flex:none}
.ok{width:84px;height:84px;border-radius:50%;background:#16c05a;color:#fff;display:grid;place-items:center;margin:4px auto 16px;animation:pop .5s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.prep{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}.prep:first-of-type{border-top:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpis>div{background:var(--bg);border-radius:14px;padding:12px}.kpis b{display:block;font-size:16px}
.dn{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}.lg{flex:1;min-width:160px}.lg>div{display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px;padding:5px 0;font-size:13px}.lg i,.lgd i{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}.lg span{flex:1}.lg small{flex-basis:100%;padding-left:18px}
.lgd{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--mu);flex-wrap:wrap;margin-top:6px}.lgd i{margin-right:6px}
.gb{transform-box:fill-box;transform-origin:bottom;animation:gw .7s ease both}@keyframes gw{from{transform:scaleY(0)}}
.eyb{border:0;background:none;color:var(--mu);cursor:pointer;padding:6px;display:grid}

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ck05:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function newA(){return{s:'login',nm:'',nim:'',k:'',k2:'',show:false,tries:0,lock:0,reset:0,mem:0}}
const accs=()=>{try{return JSON.parse(localStorage.getItem('kb_acc')||'{}')}catch(e){return{}}};

async function nimHash(n){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(n).trim()),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('kasboard-ck05'),iterations:200000},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function enter(p){PH=String(p);ok=true;try{sessionStorage.setItem('kbp',PH)}catch(e){}if(ME.no!=+p){ME={n:tc(nm(+p)),f:'',no:+p};saveMe()}A=newA();render()}
const locked=()=>{if(Date.now()<A.lock){toast('Terlalu banyak percobaan. Coba lagi sebentar.');return true}return false};
async function acheck(){if(locked())return;const m=memBy(A.nm),nim=String(A.nim).replace(/\D/g,'');if(!m||!nim){toast('Isi nama dan NIM sesuai daftar kelas.');return}if(accs()[m[0]]&&!A.reset){toast('Akun sudah terdaftar. Silakan masuk.');aset('login');return}toast('Memeriksa data…');const h=await nimHash(nim);if(h!==m[2]){A.tries++;if(A.tries>=5){A.lock=Date.now()+30000;A.tries=0}toast('NIM tidak terdaftar atau tidak sesuai. Pendaftaran tidak dapat dilanjutkan.');return}A.mem=m[0];A.nm=m[1];A.tries=0;A.k='';A.k2='';aset('np')}

 <div class="card feed">${c.tx.slice(-3).reverse().map(x=>`<div class="fl"><span class="av ${x.t=='in'?'i':'o'}">${esc(ini(nm(x.m)))}</span><span><b>${esc(nm(x.m))}</b> ${x.t=='in'?'masuk':'keluar'} <b class="${x.t}">${rp(x.a)}</b>${x.n?' · '+esc(x.n):''}</span></div>`).join('')||'<div class="empty">Belum ada aktivitas. Tekan Terima untuk mencatat iuran.</div>'}</div>

 if(tab=='tx'){h=pg('Aktivitas',seg()+`<div class="srch">${ic('srch',20)}<input id="q" placeholder="Cari transaksi" value="${esc(q)}" oninput="q=this.value;lst()"></div>`)+`<div class="mh2"><button class="lk" onclick="${go('exp')}">Statement ${ic('chev',16)}</button></div><div id="lst"></div></div>`}

 ${MEM.map(m=>{const p=paid(m[0]),s=stat(m[0]);return `<div class="row"><span class="av">${esc(ini(m[1]))}</span><div class="g"><b>${esc(m[1])}</b><small>${S(p)}</small>${c.target?`<div class="bar"><i style="width:${Math.min(100,p/c.target*100)}%"></i></div>`:''}</div><span class="tag t${s}">${TG[s]}</span>${admin?`<button class="btn o" style="padding:6px 12px" onclick="openForm('in',${m[0]})">+</button>`:''}</div>`}).join('')}</div>
 <div class="acts"><button class="btn o" onclick="remind()">Salin pengingat WhatsApp</button></div></div>`}
 if(tab=='me'){h=`<div class="top"><div class="w">${seg()}<div class="pf"><img src="${ME.f||LOGO}" alt=""><div><b>${esc(ME.n||(admin?'Bendahara':'Anggota'))}</b><small>${admin?'Bendahara':'Anggota'} · MOODBOARD CK05</small><div class="pls">${admin?`<button class="ol" onclick="newCode()">${ic('key',16)} KODE AKSES</button>`:''}<button class="ol" onclick="${go('exp')}">LAPORAN ${ic('chev',14)}</button></div></div></div></div></div><div class="w">
 <div class="card g3" style="margin-top:12px">${[['Saldo',S(t.s)],['Target iuran',c.target?rp(c.target):'Belum diatur'],['Lunas',nl+' anggota'],['Belum lunas',(MEM.length-nl)+' anggota'],['Transaksi',c.tx.length+' catatan'],['Iuran saya',ME.no?TG[stat(ME.no)]:'Belum ditautkan']].map((g,i)=>`<div><span class="gi" style="color:${['#108ee9','#ff8a00','#16c05a','#e0334c','#7b61ff','#00b4d8'][i]}">${ic(['wal','tgt','chk','clk','rcp','usr'][i],24)}</span>${g[0]}<b>${g[1]}</b></div>`).join('')}</div>
 <div class="card io"><div><span class="ci g">${ic('down')}</span><span><small>Uang Masuk</small><b>${S(t.i)}</b></span></div><div><span class="ci o">${ic('up')}</span><span><small>Uang Keluar</small><b>${S(t.o)}</b></span></div></div>
 <div class="card" style="padding:4px 14px">${[['usr','#108ee9','Anggota & iuran',go('mem')],['list','#ff8a00','Riwayat transaksi',go('tx')],['rep','#16c05a','Laporan & ekspor',go('exp')],['cog','#7b61ff','Pengaturan',go('set')]].map(m=>mi(...m)).join('')}</div></div>`}
 if(tab=='set'){h=pg('Pengaturan')+`<div class="card" style="margin-top:0;padding:4px 14px">${[['usr','#108ee9','Pengaturan Profil','profil()'],['shield','#16c05a','Pengaturan Keamanan','sec()'],['sun','#ff8a00','Pengaturan Tampilan','tampil()'],['bell','#e0334c','Pengaturan Pengingat','remind()'],['chk','#7b61ff','Verifikasi','ver()'],['link','#00b4d8','Akun Tersambung','conn()'],['rep','#16c05a','Laporan dan Ekspor',go('exp')],['out','#e0334c','Keluar','logout()']].map(m=>mi(...m)).join('')}</div></div>`}
 if(tab=='exp'){h=pg('Laporan',seg())+`<div class="card" style="margin-top:0"><h2>Laporan ${MODS[mod]}</h2><p style="color:var(--mu);margin:0 0 4px">Laporan hanya memuat saku yang sedang dipilih, jadi saldo tidak tercampur.</p>

 h+=`<nav>${nb(['home','Beranda','hm'])}${nb(['tx','Aktivitas','list'])}<button class="pay" onclick="fab()">${ic('qr',30)}${admin?'CATAT':'LAPORAN'}</button>${nb(['mem','Anggota','usr'])}${nb(['me','Saya','me'])}</nav>`;
 $('#app').innerHTML=h;if(tab=='tx')lst()}
function txList(a,del){if(!a.length)return '<div class="empty">Belum ada transaksi.</div>';const now=new Date().toISOString().slice(0,7);let p='',h='';a.forEach(x=>{const mk=x.d.slice(0,7);if(mk!=p){h+=`<div class="mh">${mk==now?'Bulan Ini':new Date(x.d).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</div>`;p=mk}h+=`<div class="row"><span class="ib ${x.t=='in'?'i':'o'}">${ic(x.t=='in'?'down':'up')}</span><div class="g"><b>${esc(x.n||x.k||(x.t=='in'?'Pemasukan':'Pengeluaran'))}</b><small>${fd(x.d)} • ${esc(nm(x.m))}${x.k?' • '+esc(x.k):''}</small></div><span class="${x.t}">${x.t=='in'?'+':'-'}${rp(x.a)}</span>${del?`<button class="x" onclick="delTx('${x.id}')">×</button>`:''}</div>`});return h}
function openForm(t,m){const d=$('#dlg');d.innerHTML=`<h2>${t=='in'?'Catat pemasukan':'Catat pengeluaran'} · ${MODS[mod]}</h2>
<label>${t=='in'?'Dari anggota':'Untuk'}</label><select id="fm"><option value="0">Umum / lainnya</option>${MEM.map(x=>`<option value="${x[0]}" ${x[0]==m?'selected':''}>${esc(x[1])}</option>`).join('')}</select>
<label>Kategori</label><select id="fk">${KT[t].map(k=>`<option ${k==(mod=='kelas'?'Kas Kelas':'Kolektif Seminar')?'selected':''}>${esc(k)}</option>`).join('')}</select>
<label>Jumlah (Rp)</label><input id="fa" type="number" inputmode="numeric" min="0"><label>Tanggal</label><input id="fd" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Catatan</label><input id="fn" placeholder="${t=='in'?'Iuran Oktober':'Beli konsumsi'}">
<div class="acts"><button class="btn o" onclick="$('#dlg').close()">Batal</button><button class="btn ${t=='in'?'g2':'r2'}" onclick="add('${t}')">Simpan</button></div>`;d.showModal()}
async function add(t){const a=+$('#fa').value;if(!a||a<=0){$('#fa').focus();return}cur().tx.push({id:Date.now().toString(36),t,k:$('#fk').value,d:$('#fd').value,m:+$('#fm').value,a,n:$('#fn').value.trim()});$('#dlg').close();render();await save()}
async function delTx(id){if(!await sure('Hapus transaksi ini?'))return;cur().tx=cur().tx.filter(x=>x.id!=id);render();await save()}
async function setTarget(){const v=await ask('Atur target iuran','Target iuran per anggota (Rp)',cur().target||'','number');if(v===null)return;cur().target=Math.max(0,+v||0);render();await save();toast('Target iuran disimpan')}
function remind(){const c=cur(),b=MEM.filter(m=>stat(m[0])<2);const s=`Halo MOODBOARD CK05! Pengingat ${MODS[mod]}.\n${c.target?'Target: '+rp(c.target)+' per anggota.\n':''}Yang belum lunas:\n`+b.map(m=>'- '+m[1]).join('\n')+'\nTerima kasih, mohon segera dilunasi ya.';navigator.clipboard.writeText(s).then(()=>toast('Pengingat disalin. Tempel di grup WhatsApp.'),()=>ask('Salin teks pengingat','Teks',s))}
function dl(name,data){const b=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function xl(){const t=tot(),c=cur(),w=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['MOODBOARD CK05 — '+MODS[mod]],[],['Pemasukan',t.i],['Pengeluaran',t.o],['Saldo',t.s]]),'Ringkasan');
 let sd=0;const bk=c.tx.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(x=>{sd+=x.t=='in'?x.a:-x.a;return[fd(x.d),x.k||'',nm(x.m),x.n,x.t=='in'?x.a:'',x.t=='out'?x.a:'',sd]});
 XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Tanggal','Kategori','Nama','Catatan','Debet (Masuk)','Kredit (Keluar)','Saldo'],...bk]),'Buku Kas');
 const ct={};c.tx.forEach(x=>{const k=(x.t=='in'?'Masuk: ':'Keluar: ')+(x.k||'Tanpa kategori');ct[k]=(ct[k]||0)+x.a});
 XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Kategori','Total (Rp)'],...Object.entries(ct)]),'Per Kategori');
 XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['No','Nama','Total bayar (Rp)','Status'],...MEM.map(m=>[m[0],m[1],paid(m[0]),TG[stat(m[0])]])]),'Anggota');
 dl(`KasBoard-${mod}-${new Date().toISOString().slice(0,10)}.xlsx`,XLSX.write(w,{type:'array',bookType:'xlsx'}))}
function png(){const t=tot(),c=cur(),W=1080,H=520+Math.ceil(MEM.length/2)*52+80,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
 x.fillStyle='#f4f7fc';x.fillRect(0,0,W,H);const g=x.createLinearGradient(0,0,W,300);g.addColorStop(0,'#0b2a63');g.addColorStop(1,'#2f7de1');x.fillStyle=g;x.fillRect(0,0,W,300);
 const im=new Image();im.onload=()=>{x.fillStyle='#fff';x.beginPath();x.arc(120,120,70,0,7);x.fill();x.drawImage(im,60,60,120,120);
 const F='Plus Jakarta Sans,sans-serif';x.fillStyle='#fff';x.font='800 44px '+F;x.fillText('Laporan '+MODS[mod],220,110);x.font='600 26px '+F;x.fillText('MOODBOARD CK05 · '+new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}),220,155);
 x.font='800 64px '+F;x.fillText(rp(t.s),60,260);x.font='600 24px '+F;x.fillText('Saldo',60,200);
 x.fillStyle='#d9f5e5';x.fillText('Masuk '+rp(t.i),520,200);x.fillStyle='#ffd3d9';x.fillText('Keluar '+rp(t.o),520,250);
 x.fillStyle='#0b2a63';x.font='800 30px '+F;x.fillText('Status iuran anggota',60,360);
 MEM.forEach((m,i)=>{const cx=60+(i%2)*500,cy=410+Math.floor(i/2)*52,s=stat(m[0]);x.fillStyle=['#d7263d','#e2a008','#12a150'][s];x.beginPath();x.arc(cx+8,cy-8,8,0,7);x.fill();x.fillStyle='#0e1b33';x.font='600 22px '+F;x.fillText(m[1].slice(0,26),cx+28,cy);x.font='400 20px '+F;x.fillStyle='#5d6b85';x.fillText(rp(paid(m[0])),cx+360,cy)});
 x.fillStyle='#5d6b85';x.font='400 20px '+F;x.fillText('Hijau lunas · Kuning kurang · Merah belum bayar',60,H-30);
 cv.toBlob(b=>dl(`KasBoard-${mod}.png`,b),'image/png')};im.src=LOGO}
function bak(){dl('kasboard-cadangan.json',JSON.stringify(D))}
function rst(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d.kelas||!d.seminar)throw 0;D=d;await save();render();toast('Data dipulihkan.')}catch(e){toast('File cadangan tidak valid.')}};i.click()}
boot();
